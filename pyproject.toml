[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==1.4.2",
]

[project.urls]
repository = "https://github.com/fairmat-nfdi/nomad-distro-oasis-b"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins =[
  "nomad-gui>=2.0.0a2.dev459",
  # "nomad-aitoolkit @ git+https://github.com/FAIRmat-NFDI/nomad-aitoolkit.git@b203f8eb28dc4b6771a39d5c5b7ad3d9d8583ac8",
  # "nomad-plugins",
  "perovskite-solar-cell-database @ git+https://github.com/FAIRmat-NFDI/nomad-perovskite-solar-cells-database.git@v0.1.1",
  "pynxtools @ git+https://github.com/FAIRmat-NFDI/pynxtools.git@master",
  "pynxtools-camels @ git+https://github.com/FAIRmat-NFDI/pynxtools-camels.git",
  "pynxtools-apm==0.5.1",
  "pynxtools-ellips==0.1.2",
  "pynxtools-em==0.4.5",
  "pynxtools-igor==0.1.6",
  "pynxtools-mpes==0.2.8",
  "pynxtools-raman==0.1.3",
  "pynxtools-spm==0.2.5",
  "pynxtools-xps==0.6.2",
  "pynxtools-xrd==0.0.8",
  "nomad-camels-plugin @ git+https://github.com/FAIRmat-NFDI/nomad-camels-plugin.git@main",
  "nomad-north-jupyter>=0.2.5",
  "nomad-north-voila>=0.1.14",
  "nomad-north-apmtools>=0.1.2",
  "nomad-north-fiji>=0.1.2",
  "nomad-north-nionswift>=0.1.2",
  "nomad-north-vesta>=0.1.2"
] 

jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]"]

[tool.uv]
index-strategy = "unsafe-best-match"
# environments = [
#   "sys_platform == 'linux'",
#   "sys_platform == 'darwin'",
#   "sys_platform == 'win32'",
# ]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/8647/packages/pypi/simple",
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]

prerelease = "explicit"
constraint-dependencies = ["flatdict>=4.1.0"]

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
